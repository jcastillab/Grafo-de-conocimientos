const DATA = {"nodos": [{"id": "conteo-rosas-portable-2026-10-08", "name": "conteo-rosas-portable-2026-10-08", "status": "active", "stack": ["python-3.12", "ultralytics", "opencv", "supervision", "pandas", "numpy", "polars", "openpyxl", "xlrd"], "tags": ["vision-artificial", "conteo-rosas", "pronostico", "series-de-tiempo", "markov", "portable"], "secciones": {"Propósito": "Proyecto Python 0.2.0 (`pyproject.toml`, paquete `conteo-rosas`) que cuenta rosas\nen video mediante visión artificial (detección y tracking con Ultralytics/BoT-SORT),\ncompara los conteos contra cortes reales semanales y genera un pronóstico semanal\nde cosecha. Ver `README.md` para la descripción completa y `docs/ARQUITECTURA.md`\npara el diseño por capas.", "Puntos de entrada": "- Lanzadores `.bat` en la raíz (Windows, usan `.venv`): `flujo_semanal.bat`,\n  `procesar_lote.bat`, `preparar.bat`, `organizar.bat`, `qc.bat`, `comparar.bat`,\n  `pronostico.bat`, `validar_pronostico.bat`, `empaquetar.bat`, `pruebas.bat`.\n- CLI: `cli.py` (invocado por `cli.bat`).\n- Paquete: `src/conteo_rosas/` (subpaquetes `ingesta`, `deteccion`, `agregacion`,\n  `comparacion`, `pronostico`, `entrenamiento`, `proyeccion`, `interfaces/gui`, etc.).\n- Configuración: `config.yaml` raíz y `configs/` (`botsort_rosas.yaml`,\n  `comparacion.yaml`, `entrenamiento.yaml`, `fenologia.yaml`, `pronostico.yaml`,\n  `modelos_pronostico_activos.json`). Rutas locales en `CAMBIAR_RUTAS.txt`.\n- Tests: `tests/` (CI en `.github/workflows/tests.yml`).", "Docs propios": "- `README.md` — visión general, instalación y uso (fuente principal).\n- `GUIA_USO.md` — guía operativa.\n- `CHANGELOG.md` — historial de versiones.\n- `docs/ARQUITECTURA.md` — arquitectura del paquete.\n- `docs/MANUAL_USUARIO.md`, `docs/GUIA_TECNICA.md`, `docs/DESARROLLO.md`.\n- `docs/COMPARACION.md` — metodología de comparación conteo vs. corte real.\n- `docs/MODELOS_PRONOSTICO.md` — modelos de pronóstico (documento extenso).\n- `docs/HANDOFF.md`, `docs/portar_a_nuevo_ mientas\\instalar.ps1`: instalación única (crea `.venv`, instala\n  requirements y torch CUDA cu128, corre diagnóstico).\n- `herramientas\\diagnostico.py --videos N`: revisa disco antes de copiar videos.\n- `herramientas\\verificar_entrega_almer.py`, `herramientas\\empaquetar.py`:\n  verificación y empaquetado de la entrega.\n- `backend\\main.py`: app FastAPI (routers en `backend\\api\\`, dominio en\n  `backend\\dominio\\`, migraciones Alembic 0001-0050 en `backend\\alembic\\versions\\`).\n- `src\\conteo_rosas\\`: motor de detección y QC vendorizado (ver su README).", "Stack": "- Backend: Python, FastAPI, SQLAlchemy 2, Alembic, SQLite, argon2 (auth), openpyxl.\n- Detección: ultralytics (YOLO), torch (CUDA cu128), torchvision, opencv,\n  supervision, imageio-ffmpeg. Dependencias en `requirements.txt` y\n  `requirements-deteccion.txt`.\n- Frontend: build Angular ya compilado en `frontend_dist\\` (servido bajo `/conteo/`).\n- Requiere GPU NVIDIA para procesar a velocidad razonable.", "Docs propios": "- `INSTALAR.md`: instalación y uso diario.\n- `docs\\GUIA_ENTREGA_ALMER.md`: guía operativa paso a paso (carga de modelo, imgsz, Excel).\n- `docs\\bi_powerpivot_spec.md`: especificación de exportación para BI.\n- `src\\README.md`: explica el motor vendorizado.\n- `MANIFIESTO.json` y `AUTOCHECK.json`: contenido, hashes del peso y resultado de auto-chequeo de la entrega.", "Notas": "- Es un artefacto de entrega, no un proyecto editable: los cambios deberían hacerse en el proyecto de origen y luego re-empaquetarse.\n- `src\\README.md` dice que es una copia del paquete `conteo_rosas` del monorepo. Hay además una carpeta hermana `C:\\Source\\conteo-rosas-portable-2026-10-08` con nombre parecido; no se verificó si es el origen, así que no se marca relación.\n- Almer llega sin modelo de procesamiento asignado (`sin_mp: true`); el `.pt` de clasificación va aparte.\n- `.datos/` contiene la BD y pesos: no son código, no conviene leerlos ni versionarlos.\n- 2026-10-16: tras la audito  "y": 407.99999999999994}, {"id": "markov_v3", "name": "markov_v3", "status": "active", "stack": ["python-3.12", "pandas", "parquet", "streamlit", "pytest"], "tags": ["forecasting", "agricultura", "ml"], "secciones": {"Propósito": "Pronóstico de corte comercial de rosas Freedom (fincas ALMER, LA PRADERA,\nSANTA HELENA). Pipeline reproducible por fases + proyección operacional\nsemanal idempotente + dashboard unificado de evaluación histórica y\npronóstico futuro.", "Puntos de entrada": "- `scripts/run_historical.py` — pipeline histórico completo (fases 0-8)\n- `scripts/train_models_cmd.py` — entrena y congela modelos (4 familias)\n- `scripts/run_operational.py` — proyecta la semana siguiente (idempotente, `ONLY_NEXT_ISO_WEEK`)\n- `scripts/validate_run.py` — valida corrida e integridad\n- `scripts/run_pipeline.py` — todo de una vez\n- `python -m streamlit run src/dashboard_streamlit.py` — dashboard\n- `python -m pytest tests -q` — tests", "Modelos operacionales": "RF, RF_HORIZON, GLM_NB, BAYES_NB — bundles en `outputs/models/bundles`.\nM3, Dirichlet-M3, P32 y Semi-Markov se retiraron el 2026-11-05 (código en `legacy/`);\nel modelo de referencia es `RF_OPT_FENO`.", "Reglas de oro propias del proyecto": "Cero leakage (features con timestamp ≤ t0), parámetros solo en\n`config/pipeline.yaml`, Excel solo como entrada RAW/auditoría (interno en\nParquet), métrica principal WAPE (nunca MAPE).", "Git y entorno": "Git inicializado el 2026-11-05 (rama `main`, commit inicial `chore: incorporar proyecto...`).\nSolo se versionan código, config, docs, tests y xlsx de `data/raw` < 5 MB; `data/vision`,\n`recepcion`, zips y `outputs/` quedan fuera. El `.venv` usa Python 3.14 aunque AGENTS.md\ndice 3.12. Auditoría completa del 2026-11-05 pendiente de corrección (Fase 2).", "Docs propios": "`README.md`, `AGENTS.md`, `docs/GUIA_DATOS_ENTRADA.md` — fuente de verdad\ndetallada. Este nodo es solo un resumen, no la reemplaza."}, "x": 400.0, "y": 516.0}, {"id": "optimizacion-rutas", "name": " function mostrarOverview(){
  titulo.textContent = "";
  const svg = svgRoot();
  marcador(svg);
  const pos = {};
  DATA.nodos.forEach(n => pos[n.id] = n);
  DATA.aristas.forEach(a => {
    const f = pos[a.from], t = pos[a.to];
    const l = el("line", {x1:f.x, y1:f.y, x2:t.x, y2:t.y, class:"arista", "marker-end":"url(#flecha)"}, svg);
    txt("title", a.tipo + ": " + a.evidencia, l);
    el("text", {x:(f.x+t.x)/2, y:(f.y+t.y)/2 - 4, "text-anchor":"middle", class:"etq"}, svg).textContent = a.tipo;

  DATA.nodos.forEach(n => {

  txt("p", "Haz clic en un proyecto para ver su detalle. Los que tienen borde punteado tienen vista interna de dependencias.", panel, "nota");

function mostrarNodo(n){
  panel.textContent = "";
  txt("h2", n.name, panel);
  txt("div", "Estado: " + n.status, panel, "nota");
  n.stack.forEach(s => txt("span", s, panel, "tag"));
  const rel = DATA.aristas.filter(a => a.from === n.id || a.to === n.id);
  for (const titulo_sec of ["Propósito", "Puntos de entrada", "Docs propios", "Notas"]) {
    if (n.secciones[titulo_sec]) {
      txt("h3", titulo_sec, panel).style.fontSize = "14px";

    }
  }
  if (rel.length) {
    txt("h3", "Relaciones", panel).style.fontSize = "14px";

  if (DATA.internos[n.id]) {

function mostrarInterno(pid){

  const d = DATA.internos[pid];
  panel.textContent = "";
  txt("h2", m.id, panel);
  txt("div", "Ruta: " + m.path, panel, "nota");
  txt("div", "Líneas: " + m.loc + " · subpaquete: " + m.subpaquete, panel, "nota");
  if (m.shim) txt("p", "Shim: " + (m.nota || "reexporta otro módulo."), panel, "nota");
  const sale = d.edges.filter(e => e.from === m.id).map(e => e.to);
  const entra = d.edges.filter(e => e.to === m.id).map(e => e.from);
  txt("h3", "Importa (" + sale.length + ")", panel).style.fontSize = "14px";
  txt("pre", sale.join("\n") || "—", panel);
  txt("h3", "Lo importan (" + entra.length + ")", panel).style.fontSize = "14px";
  txt("pre", entra.join("\n") || "—", panel);
}

document.getElementById("btn-over").addEventListener("click", mostrarOverview);
mostrarOverview();
</script>
